<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>FIAT Viewer</title>
  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Consolas, monospace;
    }
    #chart {
      width: 100vw;
      height: 100vh;
    }
    #symbolSelector {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 6px;
      font-size: 16px;
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
    }
  </style>
</head>

<body>
  <select id="symbolSelector">
    <option>BTC-USDT</option>
    <option>ETH-USDT</option>
    <option>BNB-USDT</option>
    <option>SOL-USDT</option>
    <option>AVAX-USDT</option>
    <option>SEI-USDT</option>
    <option>APT-USDT</option>
    <option>ATOM-USDT</option>
    <option>NEAR-USDT</option>
    <option>OP-USDT</option>
    <option>ARB-USDT</option>
    <option>LINK-USDT</option>
    <option>RENDER-USDT</option>
    <option>FET-USDT</option>
    <option>INJ-USDT</option>
    <option>SUI-USDT</option>
    <option>ONDO-USDT</option>
  </select>

  <div id="chart"></div>

  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script src="main.js"></script>
</body>
</html>
